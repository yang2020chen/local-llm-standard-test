name: Integrity gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML numpy transformers
      - name: Compile Python sources
        run: python -m py_compile $(git ls-files '*.py')
      - name: Run offline integrity regression suite
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax and whitespace
        run: |
          bash -n scripts/*.sh
          git diff --check
